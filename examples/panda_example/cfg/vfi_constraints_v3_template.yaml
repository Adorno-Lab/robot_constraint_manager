    vfi_type: "ENVIRONMENT_TO_ROBOT"
    entity_environment: ["x_inertial"]
    entity_robot: ["rline"]
    entity_environment_primitive_type: "LINE_ANGLE"
    entity_robot_primitive_type: "LINE_ANGLE"
    safe_distance: 5.0
    buffer: 0.0
    vfi_gain: 1.0
    direction: "SAFE_ZONE"
    tag: "C1"
