# Template for the scene panda_example.ttt. The entity names are the names of the scene objects.
# The poses and offsets are placeholders. To fill them using the scene, run:
#     ./panda_v3_generator update vfi_constraints_v3_template.yaml <v3_output_file>
vfi_file_version: 3
zero_indexed: false

metadata:
