    name: "x_inertial"
    pose:
      translation: [0.0, 0.0, 0.0]
      rotation:    [1.0, 0.0, 0.0, 0.0]
    attached_direction: "k_"
  -
    name: "Plane"
    pose:
      translation: [0.0, 0.0, 0.0]
      rotation:    [1.0, 0.0, 0.0, 0.0]
    attached_direction: "k_"
